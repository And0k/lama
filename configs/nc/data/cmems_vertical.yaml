# @package _group_
# Data config for CMEMS vertical slice training
# Vertical slices: depth × longitude (slice_mode=["time", "latitude"])
# Uses vertical mask generation from demo_nc defaults

batch_size: 2
val_batch_size: 1
num_workers: 0

dataset:
  _target_: netcdf.data.dataset.NetCDFDataset
  filepaths:
    - "/mnt/b/WorkData/CMEMS/231220_inflow/_source_NetCDF/cmems_mod_bal_phy_anfc_P1D-m_multi-vars_10.51E-21.32E_54.02N-58.97N_0.50-91.31m_2023-10-01-2023-12-01.nc"
  variables: ["|V|", "thetao", "so"]
  computed_variables:
    "|V|":
      inputs: ["uo", "vo"]
      operation: velocity_magnitude
  # Physical ranges for [0,1] normalisation.
  # CAUTION: these are overridden at runtime by the scaling YAML loaded in
  # netcdf/config.py (see configs/nc/scaling/cmems_baltic.yaml).
  # The values here are kept for reference and Hydra-based runs.
  scaling:
    "|V|": [0.0, 2.5]
    thetao: [-2.0, 22.0]
    so: [5.0, 35.0]
    uo: [-2.0, 2.0]
    vo: [-2.0, 2.0]
    wo: [-0.5, 0.5]
    bottomT: [-2.0, 22.0]
    sob: [5.0, 35.0]
  time_indices: null
  depth_indices: null
  # lat[48]=54.82N to lat[125]=56.11N — best fill ratio region (~60% valid cells)
  lat_indices: ${slice:48,126}
  # lon[141]=14.43E to lon[364]=20.63E — >60% fill across selected latitudes
  lon_indices: ${slice:141,365}
  slice_mode: ["time", "latitude"]   # Vertical slices: depth × longitude
  mask_variable: null
  mask_generator:  # Vertical mask from demo_nc defaults
    type: vertical
    n_lines: 15
    x_num: 20
    y_num: 24
    y_law: log
    seed: 42
  coverage_threshold: 0.0
  fill_ratio_threshold: 1.0
  transform:
    _target_: netcdf.data.augment.get_netcdf_transforms
    transform_variant: "light"
    flip_lat: true
    flip_lon: false
    noise_sigma: 0.01
    depth_dropout: 0.1
    crop_size: null
    crop_p: 0.5

dataloader_kwargs:
  batch_size: ${nc.data.batch_size}
  shuffle: true
  num_workers: ${nc.data.num_workers}
