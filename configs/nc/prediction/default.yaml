# Prediction configuration for NetCDF oceanographic data
# This file uses the nc data config group

defaults:
  - /nc/visualization/default
  - _self_

# Dataset configuration
dataset:
  filepaths: []  # Required: set via CLI override
  variables: ["thetao"]
  scaling:
    thetao: [-3.0, 40.0]
  time_indices: 0
  depth_indices: null  # e.g., [0,1,2] or null for all
  lat_indices: null    # Used with slice_mode=["time", "latitude"]
  lon_indices: null    # Used with slice_mode=["time", "longitude"]
  slice_mode: ["time", "depth"]  # Also: ["time", "latitude"], ["time", "longitude"], or null

# Model/checkpoint
checkpoint: no  # Required: set via CLI override

# Output
out_dir: ./inference_results

# Runtime settings
device: cpu
batch_size: 1
num_workers: 0
max_samples: null  # Set to limit samples processed
