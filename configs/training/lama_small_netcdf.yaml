defaults:
  - data/netcdf_dataset.yaml
  - settings/default.yaml

model:
  name: lama_small_train_masks
  generator:
    in_channels: ${dataset.var_names.__len__()}
  discriminator:
    in_channels: ${dataset.var_names.__len__()}

data:
  dataset: ${dataset}

training:
  batch_size: 8
  num_workers: 4
  max_epochs: 100
  optimizer:
    lr: 1e-4
data:
  datamodule:
    _target_: training.datamodule.NetCDFDataModule
    dataset_cfg:
      _target_: datasets.netcdf_vertical.NetCDFVerticalSliceDataset
      files: []
      variable: image
      mask_variable: mask
      coverage_threshold: 0.0
    batch_size: 1
    num_workers: 0

model:
  _target_: models.factory.build_model
  in_channels: 3
  num_classes: 3
  generator_cfg: null

trainer:
  max_epochs: 1
  gpus: 0
