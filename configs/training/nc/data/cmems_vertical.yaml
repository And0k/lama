# @package _group_
# Data config for CMEMS vertical slice training
# Vertical slices: depth × longitude (slice_mode=["time", "latitude"])
# Uses vertical mask generation from demo_nc defaults
#
# Data file: CMEMS physical ocean reanalysis (Baltic Sea inflow region)
#   Shape: (time=62, depth=27, latitude=298, longitude=390)
#   Time range: 2023-10-01 to 2023-12-01 (daily)
#   Depth range: 0.5m to 91.3m (27 levels)
#   Lat range: 54.02N to 58.97N
#   Lon range: 10.51E to 21.32E
#
# NaN pattern: coastal/bathymetric mask (uo, vo, wo are NaN where no water)
#   - ~56% of cells have valid uo/vo at surface
#   - Fill ratio drops with depth (bathymetry)
#   - Irregular coastline: all lat/lon have SOME NaN
#
# Selected boundaries (lat[48..125], lon[141..364]):
#   Lat: 54.82N to 56.11N (78 latitudes, best fill ratio region ~60%)
#   Lon: 14.43E to 20.63E (224 longitudes, >60% fill in selected lats)
#   Slice size: depth(27) × lon(224) = 27×224 per sample
#   Total samples: 62 (time) × 78 (lat) = 4,836

batch_size: 2
val_batch_size: 1
num_workers: 0

dataset:
  _target_: netcdf.data.dataset.NetCDFDataset
  filepaths:
    - "/mnt/b/WorkData/CMEMS/231220_inflow/_source_NetCDF/cmems_mod_bal_phy_anfc_P1D-m_multi-vars_10.51E-21.32E_54.02N-58.97N_0.50-91.31m_2023-10-01-2023-12-01.nc"
  variables: ["|V|", "thetao", "so"]
  computed_variables:
    "|V|":
      inputs: ["uo", "vo"]
      operation: velocity_magnitude
  scaling:
    "|V|": [0.0, 2.5]
    thetao: [-2.0, 22.0]
    so: [29.0, 36.0]
    uo: [-2.0, 2.0]
    vo: [-2.0, 2.0]
    wo: [-0.5, 0.5]
    bottomT: [-2.0, 22.0]
    sob: [29.0, 36.0]
  time_indices: null
  depth_indices: null
  # lat[48]=54.82N to lat[125]=56.11N — best fill ratio region (~60% valid cells)
  lat_indices: ${slice:48,126}
  # lon[141]=14.43E to lon[364]=20.63E — >60% fill across selected latitudes
  lon_indices: ${slice:141,365}
  slice_mode: ["time", "latitude"]
  mask_variable: null
  mask_generator:
    type: vertical
    n_lines: 15
    x_num: 20
    y_num: 24
    y_law: log
    seed: 42
  coverage_threshold: 0.0
  fill_ratio_threshold: 1.0
  transform:
    _target_: netcdf.data.augment.get_netcdf_transforms
    transform_variant: "light"
    flip_lat: true
    flip_lon: false
    noise_sigma: 0.01
    depth_dropout: 0.1
    crop_size: null
    crop_p: 0.5

dataloader_kwargs:
  batch_size: 2
  shuffle: true
  num_workers: 0

train:
  indir: /tmp
  batch_size: 2
  num_workers: 0

val:
  indir: /tmp
  batch_size: 1
  num_workers: 0

visual_test: null
