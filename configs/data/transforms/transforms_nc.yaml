# Data transforms for NetCDF oceanographic slices
# Applied after extracting 2D slices from the 4D NetCDF data

to_tensor: true

# Normalize each channel to [0, 1] range using dataset statistics
normalize:
  method: "minmax"  # or "meanstd"
  # If not provided, computed per-batch or per-dataset
  mean: null
  std: null

# Optional augmentations for training
augmentation:
  random_flip: true  # Random horizontal/vertical flip
  random_crop: false
  crop_size: [256, 256]

# Resize configuration if needed (e.g. for model input size)
resize:
  enabled: false
  size: [256, 256]
  mode: "bilinear"
