_group_:
  batch_size: 4
  val_batch_size: 2
  num_workers: 0
  dataset:
    _target_: netcdf.data.dataset.NetCDFDataset
    filepaths: []
    variables:
    - thetao
    - so
    - uo
    scaling:
      thetao:
      - -3.0
      - 40.0
      so:
      - 0.0
      - 40.0
      uo:
      - -2.0
      - 2.0
      vo:
      - -2.0
      - 2.0
      wo:
      - -0.5
      - 0.5
      bottomT:
      - -3.0
      - 40.0
      sob:
      - 0.0
      - 40.0
    time_indices: null
    depth_indices: null
    lat_indices: null
    lon_indices: null
    slice_mode: null
    mask_variable: null
    mask_generator:
      _target_: saicinpainting.training.data.masks.MixedMaskGenerator
      irregular_proba: 1.0
      box_proba: 0.0
      segm_proba: 0.0
      squares_proba: 0.0
      superres_proba: 0.0
      outpainting_proba: 0.0
    coverage_threshold: 0.0
  dataloader_kwargs:
    batch_size: ${nc.data.batch_size}
    shuffle: true
    num_workers: ${nc.data.num_workers}
  scaling:
    '|V|': null
    thetao:
    - -3.0
    - 40.0
    so:
    - 0.0
    - 40.0
    uo:
    - -2.0
    - 2.0
    vo:
    - -2.0
    - 2.0
    wo:
    - -0.5
    - 0.5
    bottomT:
    - -3.0
    - 40.0
    sob:
    - 0.0
    - 40.0
  output_channels:
  - '|V|'
  - thetao
  - so
  computed_variables:
    '|V|':
      inputs:
      - uo
      - vo
      operation: velocity_magnitude
  mask_generator:
    _target_: saicinpainting.training.data.masks.MixedMaskGenerator
    irregular_proba: 1.0
    box_proba: 0.0
    segm_proba: 0.0
    squares_proba: 0.0
    superres_proba: 0.0
    outpainting_proba: 0.0
  projections:
    time_depth:
      slice_mode:
      - time
      - depth
      dim_labels:
      - latitude
      - longitude
      extra_kwargs: {}
    time_lat:
      slice_mode:
      - time
      - latitude
      dim_labels:
      - depth
      - longitude
      extra_kwargs:
        lat_indices:
          _type_: slice
          start: 0
          stop: 8
    time_lon:
      slice_mode:
      - time
      - longitude
      dim_labels:
      - depth
      - latitude
      extra_kwargs:
        lon_indices:
          _type_: slice
          start: 0
          stop: 8
  time_indices:
  - 0
  depth_indices:
    _type_: slice
    start: 0
    stop: 3
  model_candidates:
  - label: big-lama
    path: ${oc.env:PROJECT_ROOT}/LaMa_models/big-lama
  - label: lama-celeba-hq
    path: ${oc.env:PROJECT_ROOT}/LaMa_models/lama-celeba-hq
  - label: lama-pl-abl
    path: ${oc.env:PROJECT_ROOT}/LaMa_models/lama-pl-abl
  cems_candidates: []
