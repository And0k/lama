# @package _group_
# Hydro synthetic dataset using Baltic SceneGenerator
# 8 input channels + 2 target channels (T, S) for HydroGenerator
#
# Uses synthetic_baltic.py SceneGenerator for physically realistic fields:
#   halocline, CIL, internal waves, jets, fronts, intrusions
#
# Mode mix: 70% realistic, 20% extended, 10% stress
# Season:   uniformly sampled per sample

batch_size: 4
val_batch_size: 2
num_workers: 4

dataset:
  _target_: netcdf.data.synthetic_dataset.HydroSyntheticDataset
  n: 400
  nx: 64
  nz: 64
  n_ctd: 5
  n_cmems_x: 8
  n_cmems_z: 10
  noise_ctd: 0.05
  noise_cmems: 0.10
  seed: 42
  mode_mix:
    realistic: 0.7
    extended: 0.2
    stress: 0.1

dataloader_kwargs:
  batch_size: ${nc.data.batch_size}
  shuffle: true
  num_workers: ${nc.data.num_workers}
